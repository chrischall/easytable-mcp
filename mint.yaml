version: 1
name: easyTable
slug: easytable
summary: >-
  easyTable restaurant reservations for Claude — check availability, look up
  bookings, and create, modify or cancel reservations BROWSER-BRIDGE MCP: it
  reaches its site through the user's signed-in tab via the fetchproxy
  bridge, so a registration also needs runtime fly-shared, bridge: true and
  a bridgePortEnv — registration fields this manifest has no schema for.
  state.dataDir below is required for bridge and is why it is declared.
env:
  - name: EASYTABLE_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. This server has ONE
  # mode, the fetchproxy browser bridge: every request to book.easytable.com
  # (and easytable.com) is dialled by the user's signed-in Chrome TAB, and the
  # process itself only listens on the loopback concentrator port the runner's
  # agent connects to. There is no direct/bootstrap/anonymous path — the site
  # Cloudflare-403s any server-side request — so the process dials nothing.
  allow: []
